# Install Python dependencies and run tests
name: 'Build and test'

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
  workflow_dispatch:

jobs:
  test:
    name: 'Run tests'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-24.04', 'windows-2025', 'macos-26']
        python-version: ['3.12']
    steps:
      - name: Check out Forest code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Forest dependencies for Linux
        # required by librosa
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt update
          sudo apt install -y ffmpeg libsndfile1
      - name: Install Forest dependencies for Windows
        # required by librosa
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: choco install ffmpeg -y --no-progress
      - name: Install Forest and optional development dependencies
        run: pip install -e ".[dev]"
      - name: Run code style checking
        run: ruff check
      - name: Run static type checking
        run: mypy -p forest
      - name: Run the test suite
        run: pytest
      - name: Validate citation file
        run: cffconvert -i CITATION.cff --validate
