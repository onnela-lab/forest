[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beiwe-forest"
version = "1.0"
description = "Forest is a library for analyzing smartphone-based high-throughput digital phenotyping data"
authors = [
    {name = "Jukka-Pekka Onnela"},
    {name = "Josh Barback"},
    {name = "Zachary Clement"},
    {name = "Hassan Dawood"},
    {name = "Georgios Efstathiadis"},
    {name = "Patrick Emedom-Nnamdi"},
    {name = "Emily J. Huang"},
    {name = "Marta Karas"},
    {name = "Gang Liu"},
    {name = "Nellie Ponarul"},
    {name = "Marcin Straczkiewicz"},
    {name = "Ilya Sytchev"},
    {name = "Anna Beukenhorst"},
]
maintainers = [
    {name = "Onnela Lab", email = "onnela.lab@gmail.com"}
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = "==3.12.*"
dependencies = [
    "holidays",
    "librosa",
    "numpy",
    "openrouteservice",
    "pandas",
    "pyproj",
    "python-dateutil",
    "tzdata",
    "ratelimit",
    "requests",
    "scipy",
    "shapely",
    "ssqueezepy",
    "timezonefinder",
    "zstandard",
]
keywords = ["digital phenotyping", "smartphone", "statistics", "accelerometer", "GPS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Documentation = "https://forest.beiwe.org"
Homepage = "https://forest.beiwe.org"
Issues = "https://github.com/onnela-lab/forest/issues"
Source = "https://github.com/onnela-lab/forest"

[project.optional-dependencies]
dev = [
    "build",
    "cffconvert",
    "ruff",
    "flake8",
    "flake8-pytest-style",
    "flake8-pyproject",
    "mypy",
    "pandas-stubs",
    "pytest",
    "pytest-mock",
    "pytest-xdist",
    "twine",
    "types-python-dateutil",
    "types-requests",
    "types-setuptools",
]


[tool.setuptools.package-data]
"forest.poplar.raw" = ["noncode/*.csv", "noncode/*.json"]


[tool.ruff]
line-length = 100  # this is the maximum that should emit a warning, it is sometimes ok to go over.
indent-width = 4


[tool.ruff.lint.pycodestyle]
max-line-length = 120  # strict maximum line length for python files. Don't get to this point, use 100.


[tool.mypy]
mypy_path = "src"
packages = ["forest"]
python_version = "3.12"


[[tool.mypy.overrides]]
module = [
    "holidays",
    "librosa",
    "openrouteservice",
    "pandas",
    "ratelimit",
    "scipy.*",
    "shapely.*",
    "ssqueezepy",
    "timezonefinder",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
# addopts = "--import-mode=importlib"  # this does not seem to be necessary anymore

testpaths = ["tests"]

filterwarnings = [
    # # Ignore specific DeprecationWarnings from librosa.core.intervals
    "ignore:path is deprecated.*:DeprecationWarning:librosa\\.core\\.intervals",
    # # Ignore FutureWarning in forest.sycamore.read_audio
    "ignore:PySoundFile failed. Trying audioread instead.*:FutureWarning:forest\\.sycamore\\.read_audio",
    # Ignore specific DeprecationWarnings from audioread.rawread for aifc, audioop, and sunau
    "ignore:'aifc' is deprecated and slated for removal in Python 3.13.*:DeprecationWarning:audioread\\.rawread",
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13.*:DeprecationWarning:audioread\\.rawread",
    "ignore:'sunau' is deprecated and slated for removal in Python 3.13.*:DeprecationWarning:audioread\\.rawread",
]


[tool.ruff.format]
indent-style = "space"  # use spaces for indentation
line-ending = "lf"  # use \n for line endings


[tool.ruff.lint]
future-annotations = true

select = [  # (linting directives to enable)
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes codes
    "UP",      # pyupgrade codes
    "COM818",  # trailing-comma-on-bare-tuple
    "A",       # flake8-annotations codes
]

extend-ignore = [  # (linting directives to ignore)
    "W293",  # blank line contains whitespace
]

exclude = [
    "build",
    ".venv",
    "venv",
    "*.ipynb",
    "private",
]


[tool.flake8]
line-length = 100
max-line-length = 100

extend-ignore = [
    "W293",  # blank line contains whitespace
]

exclude = [
    "build",
    ".venv",
    "venv",
]
