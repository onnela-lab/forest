[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beiwe-forest"
version = "1.0"
description = "Forest is a library for analyzing smartphone-based high-throughput digital phenotyping data"
authors = [
    {name = "Jukka-Pekka Onnela"},
    {name = "Josh Barback"},
    {name = "Zachary Clement"},
    {name = "Hassan Dawood"},
    {name = "Georgios Efstathiadis"},
    {name = "Patrick Emedom-Nnamdi"},
    {name = "Emily J. Huang"},
    {name = "Marta Karas"},
    {name = "Gang Liu"},
    {name = "Nellie Ponarul"},
    {name = "Marcin Straczkiewicz"},
    {name = "Ilya Sytchev"},
    {name = "Anna Beukenhorst"},
]
maintainers = [
    {name = "Onnela Lab", email = "onnela.lab@gmail.com"}
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.11"
dependencies = [
    "holidays",
    "librosa",
    "numpy",
    "openrouteservice",
    "pandas",
    "pyproj",
    "python-dateutil",
    "pytz",
    "ratelimit",
    "requests",
    "scipy",
    "shapely",
    "ssqueezepy",
    "timezonefinder",
    "zstandard",
]
keywords = ["digital phenotyping", "smartphone", "statistics", "accelerometer", "GPS"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Documentation = "https://forest.beiwe.org"
Homepage = "https://forest.beiwe.org"
Issues = "https://github.com/onnela-lab/forest/issues"
Source = "https://github.com/onnela-lab/forest"

[project.optional-dependencies]
dev = [
    "build",
    "cffconvert",
    "ruff",
    "flake8",
    "flake8-pytest-style",
    "flake8-pyproject",
    "mypy",
    "pytest",
    "pytest-mock",
    "pytest-xdist",
    "twine",
    "types-python-dateutil",
    "types-pytz",
    "types-requests",
    "types-setuptools",
]


[tool.ruff]
line-length = 105  # # this is the maximum that should emit a warning, its ok to over sometimes.
indent-width = 4

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # actual maximum line length for python files


[tool.ruff.format]
indent-style = "space"  # use spaces for indentation
line-ending = "lf"  # use \n for line endings


[tool.ruff.lint]
future-annotations = true

select = [  # (linting directives to enable)
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes codes
    "UP",      # pyupgrade codes
    "COM818",  # trailing-comma-on-bare-tuple
    "A",       # flake8-annotations codes
]

exclude = [
    "build",
    ".venv",
    "venv",
    "*.ipynb",
]


[tool.flake8]
line-length = 105
max-line-length = 105

exclude = [
    "build",
    ".venv",
    "venv",
]

[tool.setuptools.package-data]
"forest.poplar.raw" = ["noncode/*.csv", "noncode/*.json"]
